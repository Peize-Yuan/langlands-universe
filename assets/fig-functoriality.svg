<text x="600" y="668" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="10" fill="#8d96a9" letter-spacing="1.5">L(s, π, r ∘ φ) = L(s, φ(π), r)  /  函子性预测 L-函数的相容性</text>
