<text x="782" y="248" font-family="'Cambria Math','STIX Two Math','Times New Roman',serif" font-size="17" fill="#e8e0cf">L(s,π) = ∏<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> (1 − α</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> p</tspan><tspan font-size="11" dy="-7">−s</tspan><tspan dy="7">)</tspan><tspan font-size="11" dy="-7">−1</tspan></text>
